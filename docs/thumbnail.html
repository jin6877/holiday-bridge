.cells{position:relative;display:grid;grid-template-columns:repeat(12,1fr);height:100%}
.c{border-left:1.5px solid #c9d6e0;display:flex;flex-direction:column;align-items:center;padding-top:30px}

.tape{position:absolute;top:54px;height:52px;left:calc(100%/12 + 6px);width:calc(100%/12*10 - 12px);background:#ffd23f;opacity:.93;transform:rotate(-1.3deg);

.copy{position:absolute;left:52px;bottom:70px;font-family:"Black Han Sans";font-size:76px;line-height:1;letter-spacing:-.01em}
.brand{position:absolute;right:52px;bottom:74px;text-align:right}
.brand .nm{font-family:Brico;font-size:34px;letter-spacing:-.02em}
.brand .sub{font-size:18px;color:#56627c;margin-top:6px}
.rule{position:absolute;left:52px;right:52px;bottom:192px;border-top:1.5px solid #1e2a44}

</div></div>
